# Refreshes data/market.json for the Market Trends page.
# Runs every Friday at 13:00 UTC (9:00 AM EDT / 8:00 AM EST), after Freddie Mac's
# Thursday PMMS release and Redfin's Thursday data update. Can also be run by hand
# from the Actions tab ("Run workflow").
name: Update market data
on:
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest figures
        run: python3 tools/update_market_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No data changes."
          else
            git config user.name "market-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/market.json
            git commit -m "Market data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
